name: Build and push Docker images

on:
  push:
    branches: [ master, feat/download-report ]
  #pull_request:
  #  branches: [ master ]
  workflow_dispatch:
    inputs:
        docker_tag:
          default: "getcarrier/control_tower:latest"
          description: "Docker image name and tag"
          required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        id: buildx

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "value=getcarrier/control_tower:latest" >> $GITHUB_OUTPUT
          else
            SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "value=getcarrier/control_tower:${SAFE}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ inputs.docker_tag || steps.tag.outputs.value }}
